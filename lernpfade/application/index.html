<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Application Toolkit – Englisch 9</title>
<style>
:root{--navy:#1b2a49;--teal:#1f8a8a;--bg:#f4f6fa;--ink:#222a38;--grey:#6b7280;--bd:#cfd6e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:22px 16px 18px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
h1{margin:0;font-size:32px;letter-spacing:-.3px}
header p{margin:4px 0 0;color:#c3cde0;font-size:17px}
.bar{height:12px;background:#ffffff33;border-radius:6px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#8fd6d0;transition:width .4s}
.cnt{font-size:16px;color:#c3cde0;margin-top:6px}
main{padding:18px 0 40px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;margin:14px 0;overflow:hidden}
.card>button.hd{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;cursor:pointer}
.card>button.hd:focus-visible{outline:3px solid var(--teal);outline-offset:-3px}
.no{flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.card h2{margin:0;font-size:21px;line-height:1.2}
.card small{color:var(--grey);font-size:15px}
.chk{margin-left:auto;font-size:15px;font-weight:700;border-radius:20px;padding:4px 12px;background:#eef1f6;color:var(--grey);white-space:nowrap}
.done .chk{background:#d8f1e3;color:#1c6b3b}
.body{display:none;padding:0 18px 18px;border-top:1px solid var(--bd)}
.open .body{display:block}
.goal{margin:14px 0 8px;padding:10px 14px;border-left:6px solid var(--c);background:#f1f4f8;border-radius:0 10px 10px 0;font-weight:700}
.tip{margin:6px 0 14px;padding-left:20px;color:#3a4352;font-size:18px}
.q{margin:16px 0 6px;font-weight:700}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;min-height:48px;margin:6px 0;padding:10px 14px;border:2px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;font-size:18px}
.opt:focus-visible{outline:3px solid var(--teal)}
.opt.ok{border-color:#2e9e4f;background:#e6f6ec}
.opt.no{border-color:#d0392e;background:#fdeceb}
.opt[disabled]{cursor:default}
.fb{min-height:24px;font-size:17px;margin:2px 2px 6px;color:#3a4352}
.self{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.self b{margin-right:4px}
.mark{all:unset;box-sizing:border-box;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--navy);cursor:pointer;font-weight:700;font-size:17px}
.mark[aria-pressed=true]{background:var(--navy);color:#fff}
.mark:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.toolkit{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:6px 18px 12px;margin-top:24px}
.toolkit h2{margin:10px 0 4px;font-size:22px}
.toolkit ol{margin:6px 0;padding-left:26px}
.toolkit li{margin:6px 0;color:#9aa3b2}
.toolkit li.on{color:var(--ink);font-weight:600}
.toolkit li.on::marker{color:var(--teal)}
.reset{all:unset;display:inline-block;margin-top:18px;min-height:44px;padding:8px 14px;color:var(--grey);cursor:pointer;text-decoration:underline;font-size:16px}
footer{color:var(--grey);font-size:15px;padding:0 0 30px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Application Toolkit</h1>
  <p>Eight levels · every level adds one line to your card for the Guided Writing exam</p>
  <div class="bar"><i id="barfill"></i></div><div class="cnt" id="cnt"></div>
</div></header>
<main class="wrap">
  <div id="levels"></div>
  <section class="toolkit" aria-live="polite"><h2>My Toolkit card: I can …</h2><ol id="card"></ol></section>
  <button class="reset" id="reset" type="button">Reset my progress on this device</button>
</main>
<div class="wrap"><footer>Student’s Book Red Line Bayern 5, Klasse 9 · Übungsmaterial, keine Leistungserhebung · Keine Daten werden übertragen; der Fortschritt bleibt nur in diesem Browser.</footer></div>
<script>
"use strict";
var LEVELS=[{"id": "l1", "n": 1, "title": "Strengths: claim it and prove it", "book": "SB pp. 38–39", "color": "#1f8a8a", "goal": "Point + 3 details: I give three different ideas for each content point.", "tip": ["A content point that is only <b>mentioned</b> earns nothing.", "One idea = <b>included</b>. Two ideas = <b>elaborated</b>. Three ideas = <b>fully elaborated</b>.", "A list (“I like A, B and C”) counts as <b>one</b> detail only."], "qs": [{"q": "Content point: <i>personal qualities</i>. Which text is fully elaborated (three different details)?", "o": ["I am friendly, creative and patient.", "I am friendly because I like helping people. At school I help new classmates, and last year I organised a class party.", "I have many personal qualities."], "why": "Three separate ideas: liking to help, helping new classmates, organising a party. Text A is a list (one detail). Text C only mentions the point.", "h": "d75ec2c684c418dc282083ef65b6ae56f8a16f839d966e3189aa185e1e138690"}, {"q": "“I like cooking, swimming and reading.” How many details is this?", "o": ["three details", "one detail", "no detail", "two details"], "why": "A list counts as one detail.", "h": "eb63a91de1218e1830ade371ffad7fac9cd099f2a494cc683f316830cdf98c4a"}]}, {"id": "l2", "n": 2, "title": "Read the ad: find the content points", "book": "SB pp. 34, 40, 50", "color": "#3b6fb6", "goal": "I answer every content point and write nothing irrelevant.", "tip": ["Underline <b>what the company wants to know</b>: these are your content points (usually four).", "Skipping one point costs a lot: with one point missing the best possible band is 4.", "Details that do not belong to a content point are <b>irrelevant</b> and do not count."], "qs": [{"q": "The ad asks for: <i>reasons for applying · school subjects · experience with cars · personal qualities</i>. Alex writes three paragraphs: reasons, school subjects, personal qualities. What is missing?", "o": ["reasons for applying", "school subjects", "experience with cars", "personal qualities"], "why": "Experience with cars is the missing content point.", "h": "875eec0bcc9f734189389fd1ff34a7b5ea06cd026ef02abc1699589d6145f729"}, {"q": "Content point: <i>experience</i>. Which sentence is irrelevant?", "o": ["Last summer I worked in a bike shop.", "I helped customers and repaired tyres.", "My favourite colour is green.", "I learned to work in a team there."], "why": "The favourite colour has nothing to do with experience.", "h": "6dac2a81b857c1c3d810b910236d0c688cfb362787fa3b0ee9c6a61ae4c95cf2"}]}, {"id": "l3", "n": 3, "title": "Build your letter", "book": "SB pp. 40, 50–51", "color": "#7a4fb0", "goal": "I write a topic sentence and start a new paragraph for each new idea.", "tip": ["Structure: <b>beginning – skills &amp; experience – personal qualities – reasons – questions – ending</b>.", "A <b>topic sentence</b> opens each content point, e.g. “Let me tell you about my skills.”", "The order of the points may change if the text stays logical."], "qs": [{"q": "Which is the best topic sentence for a paragraph about your skills?", "o": ["I like cars.", "Let me tell you about my skills.", "Dear Sir or Madam,", "Thank you."], "why": "It introduces the next content point.", "h": "3ba0c31756e36fb2b6a116dd1782524e4b34703491a55b7a949e91c8ac85cd45"}, {"q": "You begin with “Dear Mr Hall,”. Which ending fits?", "o": ["Yours faithfully,", "Yours sincerely,", "Cheers,", "Love,"], "why": "Dear + name → Yours sincerely.", "h": "f45bdd94241c5f778b3924f6aaed50a4377cbb704af46214e66c3f8bef3cd184"}]}, {"id": "l4", "n": 4, "title": "Linking: from basic to complex", "book": "Linking devices", "color": "#c26a1f", "goal": "I use at least 4 different linking words; at least 2 are complex.", "tip": ["Basic: and, because, but, so, also, then.", "Complex: however, therefore, in addition, besides, as soon as, although, for instance, all in all.", "Count your words: short texts limit your band."], "qs": [{"q": "Which word is a complex linker for contrast?", "o": ["but", "however", "so", "because"], "why": "However is complex; but is basic.", "h": "925487d087ab4688c9e8d40002fc6797964075b2895b1cc5e9c8792a0131578b"}, {"q": "“I have worked in a shop. ___, I have helped at a summer camp.”", "o": ["However", "In addition", "Therefore", "Although"], "why": "In addition adds one more idea.", "h": "b869ae25bacf861802c28c319f9364e9e722fb09f4afce95d42c08bf2712025f"}]}, {"id": "l5", "n": 5, "title": "Grammar booster", "book": "G6, present perfect", "color": "#b0305a", "goal": "I use at least 3 complex structures (present perfect, relative clause, if-sentence, gerund …).", "tip": ["Only simple structures, even without mistakes, limit your band.", "Try: <b>I have worked …</b> · <b>I am a person who …</b> · <b>If I got the job, I would …</b> · <b>I enjoy working …</b>"], "qs": [{"q": "Which sentence uses a complex structure?", "o": ["I work in a shop.", "I have worked in a shop for two years.", "I like shops.", "I am in a shop."], "why": "Present perfect = complex tense.", "h": "9b5c5c901192055fe3066aecb74fe10bf685ace09782bd12d6e1dd683ffec64f"}, {"q": "“I am a person ___ enjoys working with children.”", "o": ["who", "which", "where", "what"], "why": "who for people.", "h": "39f72caa83f9c704d044a76614dc4d8f2b2813bc1b3eda4a35ef5747ea5d87c1"}]}, {"id": "l6", "n": 6, "title": "Register and genre", "book": "SB pp. 43, 51", "color": "#2a7d4f", "goal": "I use formal language: Dear …, I am writing to apply for …, Yours sincerely.", "tip": ["An application is a <b>formal</b> text: greeting, clear beginning, middle, ending.", "Avoid slang and exclamation marks. Occasional informal words cost points; constant informal language costs more."], "qs": [{"q": "Which sentence is too informal for an application?", "o": ["I am writing to apply for the position.", "Hi there, I really want this job, it would be awesome!", "I would be grateful for the opportunity.", "I look forward to hearing from you."], "why": "Slang and a chatty tone.", "h": "f5524f24efca7a98b005e0edd56b5add135eaca05ddc6076a0b0852f5d6b902c"}, {"q": "Which is the best first sentence?", "o": ["Hey, I saw your ad.", "I am writing to apply for the position of apprentice electrician.", "Give me the job.", "About your ad…"], "why": "Clear purpose, formal tone.", "h": "89ca46ea1b3cc6bd2f5a36c696be5ee025ee412a8d4cbb063fa051a6493719a2"}]}, {"id": "l7", "n": 7, "title": "Vocabulary: your own words", "book": "V pp. 155–156", "color": "#8a6a00", "goal": "I use my own words and do not copy from the ad.", "tip": ["Words copied from the task do not count for your vocabulary range.", "Make a word web: creative → imaginative, original …"], "qs": [{"q": "The ad says: “You should be reliable and good at working in a team.” Which sentence uses your own words?", "o": ["I am reliable and good at working in a team.", "People can count on me, and I enjoy working with others."], "why": "Paraphrase, not lifting.", "h": "2f0d4539bd629968cf81d3c181b7020fbb8ce749b4000bd71d0603e28c4b8822"}, {"q": "Which word means almost the same as <i>creative</i>?", "o": ["imaginative", "strict", "tired", "lazy"], "why": "Imaginative = creative.", "h": "ba6801eddaad4a2a4eb698a210184a6b52a717619e19f8cd438315fbce9d1dab"}]}, {"id": "l8", "n": 8, "title": "Complete application and rating", "book": "SB pp. 43/9, 51/3", "color": "#1b2a49", "goal": "I write about 200 words, count them and check my text.", "tip": ["Aim for <b>200 words</b>.", "Up to 150 words: Coherence, Grammar and Vocabulary reach at most band 5. Up to 100 words: band 3.", "Write, count, check with your toolkit card, then swap with a partner."], "qs": [{"q": "Your text has 120 words. What is the highest possible band for Coherence, Grammar and Vocabulary?", "o": ["7", "5", "3", "1"], "why": "Up to 150 words → max. band 5.", "h": "db43137b4bbd10c2df567afebdd664a78fcea581d342d6b53d63e79360597d61"}, {"q": "All four content points are only <i>included</i> (one detail each). What is the highest band for Task Achievement?", "o": ["7", "5", "4", "2"], "why": "No elaboration → max. band 2.", "h": "31ad456761592e762957e3441beb65a85fa14f2c01e135ec526de530fd5c53a4"}]}];
/* compact SHA-256 so the page also works offline without crypto.subtle */
function sha256(s){function r(n,x){return(x>>>n)|(x<<(32-n))}var K=[],H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],p=[],i,j,c=2;
while(K.length<64){var pr=true;for(i=2;i*i<=c;i++)if(c%i==0){pr=false;break}if(pr){K.push((Math.pow(c,1/3)%1)*4294967296|0);}c++}
var b=unescape(encodeURIComponent(s)),l=b.length*8,w=[];for(i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
w[l>>5]|=128<<(24-l%32);w[(((l+64)>>9)<<4)+15]=l;
for(j=0;j<w.length;j+=16){var a=H.slice(0),W=[];for(i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{var s0=r(7,W[i-15])^r(18,W[i-15])^(W[i-15]>>>3),s1=r(17,W[i-2])^r(19,W[i-2])^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
var S1=r(6,a[4])^r(11,a[4])^r(25,a[4]),ch=(a[4]&a[5])^(~a[4]&a[6]),t1=(a[7]+S1+ch+K[i]+W[i])|0,S0=r(2,a[0])^r(13,a[0])^r(22,a[0]),mj=(a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]),t2=(S0+mj)|0;
a=[(t1+t2)|0,a[0],a[1],a[2],(a[3]+t1)|0,a[4],a[5],a[6]]}
for(i=0;i<8;i++)H[i]=(H[i]+a[i])|0}
return H.map(function(x){return('00000000'+(x>>>0).toString(16)).slice(-8)}).join('')}
function norm(t){return t.toLowerCase().replace(/’/g,"'").replace(/\s+/g," ").trim()}
var KEY="english9-application-toolkit-v1",state={done:{},ans:{}};
try{var raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function strip(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent}
var box=document.getElementById("levels");
LEVELS.forEach(function(L){
  var c=document.createElement("div");c.className="card";c.style.setProperty("--c",L.color);c.id=L.id;
  var h='<button class="hd" type="button" aria-expanded="false"><span class="no" style="background:'+L.color+'">'+L.n+'</span><span><h2>'+L.title+'</h2><small>'+L.book+'</small></span><span class="chk">open</span></button><div class="body">';
  h+='<div class="goal">'+L.goal+'</div><ul class="tip">'+L.tip.map(function(t){return"<li>"+t+"</li>"}).join("")+'</ul>';
  L.qs.forEach(function(q,qi){
    h+='<div class="q">'+(qi+1)+'. '+q.q+'</div>';
    q.o.forEach(function(o,oi){h+='<button class="opt" type="button" data-q="'+qi+'" data-o="'+oi+'">'+o+'</button>'});
    h+='<div class="fb" id="fb-'+L.id+'-'+qi+'"></div>';
  });
  h+='<div class="self"><b>I can do this:</b><button class="mark" type="button" data-self="2">Yes</button><button class="mark" type="button" data-self="1">Almost</button><button class="mark" type="button" data-self="0">Not yet</button></div></div>';
  c.innerHTML=h;box.appendChild(c);
  c.querySelector(".hd").onclick=function(){var o=c.classList.toggle("open");this.setAttribute("aria-expanded",o)};
  c.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){answer(L,c,+b.dataset.q,+b.dataset.o)}});
  c.querySelectorAll(".mark").forEach(function(b){b.onclick=function(){state.done[L.id]=+b.dataset.self;save();paint()}});
});
function answer(L,c,qi,oi){
  var q=L.qs[qi],btns=c.querySelectorAll('.opt[data-q="'+qi+'"]'),fb=document.getElementById("fb-"+L.id+"-"+qi);
  var good=sha256(L.id+":"+norm(strip(q.o[oi])))===q.h;
  if(good){btns.forEach(function(b){b.disabled=true;if(+b.dataset.o===oi)b.classList.add("ok")});fb.textContent="Correct.";state.ans[L.id+qi]=1;save();paint()}
  else{btns[oi].classList.add("no");btns[oi].disabled=true;fb.textContent="Not quite – read the tips again and try another answer."}
}
function paint(){
  var n=0;
  LEVELS.forEach(function(L){
    var c=document.getElementById(L.id),v=state.done[L.id],chk=c.querySelector(".chk");
    c.classList.toggle("done",v===2);
    chk.textContent=v===2?"✓ I can do this":(v===1?"almost":"open");
    c.querySelectorAll(".mark").forEach(function(b){b.setAttribute("aria-pressed",String(v!==undefined&&+b.dataset.self===v))});
    if(v===2)n++;
  });
  document.getElementById("barfill").style.width=(n/LEVELS.length*100)+"%";
  document.getElementById("cnt").textContent=n+" of "+LEVELS.length+" levels mastered";
  var ol=document.getElementById("card");ol.innerHTML="";
  LEVELS.forEach(function(L){var li=document.createElement("li");li.textContent=L.goal;if(state.done[L.id]===2)li.className="on";ol.appendChild(li)});
}
document.getElementById("reset").onclick=function(){if(confirm("Delete your progress on this device?")){state={done:{},ans:{}};save();location.reload()}};
paint();
</script>
</body>
</html>
