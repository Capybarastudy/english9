<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SPARK! – Blackout at Bright Sparks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1b33'/%3E%3Cpath d='M36 6 16 36h14l-4 22 22-32H34z' fill='%23ffc933'/%3E%3C/svg%3E">
<style>
:root{--navy:#0b1630;--panel:#15264a;--panel2:#1d3463;--yel:#ffc933;--yel-d:#d99f00;--cyan:#3ddbd0;--paper:#f6f8fc;--ink:#12203a;--muted:#5a6a87;--ok:#23b26b;--bad:#ff5a5f;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{color:#fff;background:var(--navy);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 600px at 70% -10%,#1d3a78 0,transparent 60%),linear-gradient(180deg,#0e1d3f,#070f22)}
#bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{line-height:1.2;margin:.4em 0}
h1{font-size:38px;letter-spacing:.02em}
h2{font-size:28px}
h3{font-size:21px}
p{margin:.5em 0}
.hidden{display:none!important}
.btn{min-height:52px;min-width:52px;padding:10px 24px;border-radius:14px;border:0;background:var(--yel);color:#1b1500;font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--yel-d)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--yel-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.small{min-height:44px;font-size:17px;padding:6px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.glass{background:rgba(21,38,74,.75);border:1px solid rgba(255,255,255,.16);border-radius:var(--r);padding:16px 18px}
/* top bar */
#topbar{position:sticky;top:0;z-index:20;background:rgba(7,15,34,.94);border-bottom:1px solid rgba(255,255,255,.12);padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}
#topbar .in{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.power{display:flex;align-items:center;gap:10px;min-width:170px}
.power .lab{font-size:12px;letter-spacing:.12em;opacity:.75;text-transform:uppercase;line-height:1}
.power .time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.power.low .time{color:#ffb347}
.power.over .time{color:var(--bad);animation:pulse 1.2s infinite}
.bat{width:46px;height:24px;border:3px solid #fff;border-radius:5px;position:relative;flex:none}
.bat:after{content:"";position:absolute;right:-8px;top:5px;width:5px;height:10px;background:#fff;border-radius:0 2px 2px 0}
.bat i{position:absolute;left:2px;top:2px;bottom:2px;background:var(--cyan);border-radius:2px;transition:width .4s}
.power.low .bat i{background:#ffb347}.power.over .bat i{background:var(--bad)}
.letters{display:flex;gap:6px;flex:1;justify-content:center;min-width:240px}
.lt{width:34px;height:42px;border-radius:8px;border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--navy)}
.lt.on{background:var(--yel);border:2px solid var(--yel);animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#banner{background:#7a1d24;color:#fff;text-align:center;padding:8px 14px;font-weight:700}
/* start */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;margin-top:22px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .sub{color:var(--yel);letter-spacing:.14em;text-transform:uppercase;font-size:15px;font-weight:700}
.rules{margin:10px 0 0;padding-left:22px}.rules li{margin:5px 0}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
input[type=text],textarea,select{background:#fff;color:var(--ink);border:3px solid #c5cee0;border-radius:12px;padding:8px 12px;font-size:19px;min-height:48px}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--yel)}
#teamname{flex:1;min-width:200px}
/* map */
.prog{height:12px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--yel);transition:width .5s}
.fuses{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.fuses{grid-template-columns:repeat(2,1fr)}}
.fuse{background:var(--panel);border:2px solid rgba(255,255,255,.14);border-radius:var(--r);padding:12px;text-align:left;min-height:130px;color:#fff;display:flex;flex-direction:column;gap:6px}
.fuse .no{font-size:13px;letter-spacing:.12em;opacity:.7}
.fuse .nm{font-weight:800;font-size:19px;line-height:1.2}
.fuse svg{width:36px;height:36px}
.fuse.lock{opacity:.45;cursor:default}
.fuse.now{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,201,51,.3),0 0 24px rgba(255,201,51,.35);animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,201,51,.5),0 0 34px rgba(255,201,51,.6)}}
.fuse.done{background:#123d33;border-color:var(--ok)}
.fuse .st{margin-top:auto;font-size:14px;font-weight:700}
.main-sw{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:16px}
@media (min-width:641px){.main-sw{grid-column:auto}}
/* room */
.room{margin-top:16px}
.room .hd{display:flex;gap:14px;align-items:center}
.room .hd svg{width:52px;height:52px;flex:none}
.room .bk{color:var(--cyan);font-size:15px;font-weight:700;letter-spacing:.04em}
.brief{margin:10px 0;color:#e8eefc}
.task{background:rgba(255,201,51,.14);border-left:5px solid var(--yel);padding:8px 14px;border-radius:8px;font-weight:700;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #dfe5f1}
.item:last-child{border-bottom:0}
.item .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.item .tx{flex:1 1 280px;font-size:19px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:48px;min-width:56px;padding:6px 16px;border-radius:12px;border:3px solid #b9c4dc;background:#fff;color:var(--ink);font-weight:700;font-size:18px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
select{min-width:210px;max-width:100%;font-size:18px}
.sent{font-size:20px;line-height:2.1}
.sent select,.sent input{margin:0 6px;vertical-align:middle}
.sent input{width:190px}
.sent .vb{color:var(--muted);font-size:17px}
.pool,.slots{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.ocard{min-height:52px;padding:8px 14px;border-radius:12px;border:3px solid #b9c4dc;background:#fff;color:var(--ink);text-align:left;font-size:18px;display:flex;gap:10px;align-items:center;max-width:100%}
.ocard.used{opacity:.3}
.ocard .nn{background:var(--yel);color:#1b1500;border-radius:50%;width:28px;height:28px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
.slot{width:100%;display:flex;gap:10px;align-items:center;min-height:52px;border:3px dashed #b9c4dc;border-radius:12px;padding:4px 10px;color:var(--muted)}
.slot.f{border-style:solid;border-color:var(--ink);background:#eef2fb;color:var(--ink);text-align:left;font-size:18px}
.slot .nn{background:var(--ink);color:#fff;border-radius:50%;width:28px;height:28px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
.feedback{min-height:30px;margin:12px 0 4px;font-weight:700;font-size:19px}
.feedback.bad{color:#c4262e}.feedback.info{color:var(--muted)}.feedback.good{color:#13804a}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pen{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:34px;font-weight:800;padding:10px 26px;border-radius:16px;z-index:60;animation:fl 1.5s forwards;pointer-events:none}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.ov{position:fixed;inset:0;background:rgba(5,10,24,.88);z-index:70;display:grid;place-items:center;text-align:center;padding:20px}
.ov .big{font-size:120px;font-weight:900;color:var(--yel);line-height:1;animation:pop .7s}
.modal{position:fixed;inset:0;background:rgba(5,10,24,.78);z-index:80;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:20px 22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.modal h3{margin-top:0}
/* finale */
.code{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.code .lt{width:48px;height:58px;font-size:30px}
#finalin{text-align:center;text-transform:uppercase;letter-spacing:.3em;font-size:28px;width:min(100%,360px)}
/* certificate */
.cert{background:#fffdf5;color:var(--ink);border:8px double var(--navy);border-radius:10px;padding:26px 22px;text-align:center;margin-top:18px}
.cert h2{font-size:34px;margin:.2em 0;color:var(--navy)}
.cert .team{font-size:34px;font-weight:800;margin:.2em 0;color:#8a5d00}
.cert .facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.cert .facts div{background:var(--navy);color:#fff;border-radius:12px;padding:8px 16px;min-width:150px}
.cert .facts b{display:block;font-size:26px;color:var(--yel)}
textarea{width:100%;min-height:110px;resize:vertical;margin-top:8px}
.tbtn{position:fixed;right:10px;bottom:10px;z-index:40;opacity:.35;min-height:44px;min-width:44px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-weight:800}
table.sol{border-collapse:collapse;width:100%;font-size:16px}
table.sol td,table.sol th{border-bottom:1px solid #d0d8ea;padding:6px 8px;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var box=el("div",{class:"namebox"});var inp=el("input",{type:"text",id:"teamname",maxlength:"24",placeholder:"Your team name",autocomplete:"off","aria-label":"Team name"});
  var go=el("button",{class:"btn",type:"button",text:"Start the game ⚡",onclick:function(){var n=inp.value.trim();if(!n){inp.focus();inp.style.borderColor="#ff5a5f";return}S=fresh();S.team=n;S.started=now();S.view="map";save();showTop(true);renderTop();renderMap()}});
  box.appendChild(inp);box.appendChild(go);left.appendChild(box);
  m.appendChild(el("div",{class:"hero"},[left,el("div",{html:heroSvg()})]));
  m.appendChild(el("p",{class:"sub",style:"color:#9fb2d8;font-size:15px;margin-top:22px",text:"Practice game, not a test. No data is sent anywhere; your team name stays on this iPad."}));
}

/* map */
function renderMap(){
  S.view="map";save();var m=$("#main");m.innerHTML="";
  m.appendChild(el("h2",{text:"Fuse boxes"}));
  m.appendChild(el("div",{html:'<div class="prog"><i style="width:'+(S.progress/NR*100)+'%"></i></div>'}));
  var g=el("div",{class:"fuses"});
  ROOMS.forEach(function(R,i){
    var st=i<S.progress?"done":(i===S.progress?"now":"lock");
    var b=el("button",{class:"fuse "+st,type:"button","aria-label":"Fuse box "+R.n+": "+R.title+(st==="done"?" (done)":st==="lock"?" (locked)":"")});
    b.innerHTML='<div class="no">FUSE '+R.n+'</div>'+icon(R.n,st==="done"?"#23b26b":"#ffc933")+'<div class="nm">'+R.title+'</div><div class="st">'+(st==="done"?"✓ Reset – letter "+S.letters[i]:st==="now"?"▶ Tap to open":"Locked")+'</div>';
    if(st==="now")b.addEventListener("click",function(){openRoom(i)});
    else if(st==="done")b.addEventListener("click",function(){modal(R.title,"<p>This fuse is already reset. Your letter: <b>"+S.letters[i]+"</b></p><p>"+R.book+"</p>")});
    g.appendChild(b)});
  var fin=el("button",{class:"fuse main-sw "+(S.progress>=NR?"now":"lock"),type:"button","aria-label":"Main switch"});
  fin.innerHTML=icon(8,S.progress>=NR?"#ffc933":"#9fb2d8")+'<div><div class="no">FINALE</div><div class="nm">Main switch</div><div class="st">'+(S.progress>=NR?"▶ Enter the code word":"Locked – reset all 7 fuses")+'</div></div>';
  if(S.progress>=NR)fin.addEventListener("click",openFinale);g.appendChild(fin);m.appendChild(g);
  m.appendChild(el("p",{style:"margin-top:16px;color:#c9d6f2",text:"Team: "+S.team+" · Fuse boxes open one after the other."}));
}

/* room */
function setDraft(room,i,v){var d=S.drafts[room.id]||(S.drafts[room.id]=[]);d[i]=v;save()}
function getDraft(room,i){return (S.drafts[room.id]||[])[i]||""}
function openRoom(i){
  var R=ROOMS[i];S.view=i;save();var m=$("#main");m.innerHTML="";
  var top=el("div",{class:"room"});
  var hd=el("div",{class:"hd"});hd.innerHTML=icon(R.n)+'<div><div class="bk">FUSE '+R.n+' OF '+NR+' · '+R.book+'</div><h2 style="margin:.1em 0">'+R.title+'</h2></div>';
  top.appendChild(hd);top.appendChild(el("div",{class:"brief",html:R.intro}));top.appendChild(el("div",{class:"task",text:R.task}));
  var card=el("div",{class:"card"});buildForm(R,card);top.appendChild(card);
  var fb=el("div",{class:"feedback",id:"fb","aria-live":"polite"});top.appendChild(fb);
  var act=el("div",{class:"actions"});
  var cb=el("button",{class:"btn",id:"checkbtn",type:"button",text:"Check",onclick:function(){doCheck(R)}});cb.setAttribute("data-label","Check");act.appendChild(cb);
  act.appendChild(el("button",{class:"btn sec small",type:"button",text:"← Back to the fuse boxes",onclick:renderMap}));top.appendChild(act);
  m.appendChild(top);window.scrollTo(0,0);tick();
}
function seg(room,i,opts,card){
  var cur=getDraft(room,i),box=el("div",{class:"seg",role:"group"});
  opts.forEach(function(o){var b=el("button",{type:"button","data-v":o,"aria-pressed":cur===o?"true":"false",text:o,onclick:function(){setDraft(room,i,o);[].forEach.call(box.children,function(x){x.setAttribute("aria-pressed",x===b?"true":"false")})}});box.appendChild(b)});
  return box}
function selectEl(room,i,opts){
  var s=el("select",{"data-i":i,"aria-label":"Choose"});s.appendChild(el("option",{value:"",text:"Choose …"}));
  opts.forEach(function(o){s.appendChild(el("option",{value:o,text:o}))});s.value=getDraft(room,i);
  s.addEventListener("change",function(){setDraft(room,i,s.value)});return s}
function buildForm(R,card){
  if(R.kind==="pick"){R.rows.forEach(function(r,i){card.appendChild(el("div",{class:"item"},[el("div",{class:"no",text:String(i+1)}),el("div",{class:"tx",text:r.t}),seg(R,i,R.opts)]))})}
  else if(R.kind==="select"){R.rows.forEach(function(r,i){card.appendChild(el("div",{class:"item"},[el("div",{class:"no",text:String(i+1)}),el("div",{class:"tx",text:r.t}),selectEl(R,i,r.o||R.opts)]))})}
  else if(R.kind==="gaps"){R.rows.forEach(function(r,i){var p=el("div",{class:"item"},[el("div",{class:"no",text:String(i+1)})]);var s=el("div",{class:"sent tx"});s.appendChild(document.createTextNode(r.pre));s.appendChild(selectEl(R,i,r.o));s.appendChild(document.createTextNode(r.post));p.appendChild(s);card.appendChild(p)})}
  else if(R.kind==="type"){R.rows.forEach(function(r,i){var p=el("div",{class:"item"},[el("div",{class:"no",text:String(i+1)})]);var s=el("div",{class:"sent tx"});s.appendChild(document.createTextNode(r.pre));
    var inp=el("input",{type:"text","data-i":i,autocomplete:"off",autocapitalize:"off",autocorrect:"off",spellcheck:"false","aria-label":"Gap "+(i+1)});inp.value=getDraft(R,i);inp.addEventListener("input",function(){setDraft(R,i,inp.value)});s.appendChild(inp);
    if(r.v)s.appendChild(el("span",{class:"vb",text:r.v}));s.appendChild(document.createTextNode(r.post));p.appendChild(s);card.appendChild(p)})}
  else if(R.kind==="order"){buildOrder(R,card)}
}
function buildOrder(R,card){
  var d=S.drafts[R.id]||(S.drafts[R.id]=[]);var byId={};R.cards.forEach(function(c){byId[c.id]=c.t});
  var slots=el("div",{class:"slots"}),pool=el("div",{class:"pool"});
  card.appendChild(el("h3",{text:"Your letter",style:"margin-top:0"}));card.appendChild(slots);card.appendChild(el("h3",{text:"Cards"}));card.appendChild(pool);
  function paint(){
    slots.innerHTML="";pool.innerHTML="";
    for(var i=0;i<R.count;i++){
      (function(i){var id=d[i];
        if(id){var b=el("button",{class:"slot f",type:"button","data-slot":i,"aria-label":"Position "+(i+1)+": "+byId[id]+". Tap to remove."},[el("span",{class:"nn",text:String(i+1)}),el("span",{text:byId[id]})]);b.addEventListener("click",function(){d.splice(i,1);save();paint()});slots.appendChild(b)}
        else slots.appendChild(el("div",{class:"slot"},[el("span",{class:"nn",style:"background:#b9c4dc",text:String(i+1)}),el("span",{text:"…"})]))})(i)}
    R.cards.forEach(function(c){var used=d.indexOf(c.id)>=0;var b=el("button",{class:"ocard"+(used?" used":""),type:"button","data-card":c.id,text:c.t});if(used)b.disabled=true;
      b.addEventListener("click",function(){if(d.length>=R.count){feedback("All eight places are full. Tap a card in your letter to take it out.","info");return}d.push(c.id);save();paint()});pool.appendChild(b)})}
  paint()}

function feedback(msg,kind){var f=$("#fb");if(f){f.className="feedback "+(kind||"");f.textContent=msg}}
function need(R){return R.kind==="order"?R.count:R.rows.length}
function doCheck(R){
  if(lockLeft()>0)return;
  var n=need(R),vals=[];for(var i=0;i<n;i++){var v=(S.drafts[R.id]||[])[i];if(!v||!String(v).trim()){feedback("Please answer every item first.","info");return}vals.push(v)}
  var cb=$("#checkbtn");cb.disabled=true;cb.setAttribute("data-busy","1");
  Promise.all(vals.map(function(v,i){return check(R.id,i,v)})).then(function(res){
    cb.removeAttribute("data-busy");var ok=res.filter(Boolean).length;
    if(ok===n){solve(R)}else{wrong(ok,n,R.kind==="order")}})}
function wrong(ok,n,isOrder){
  S.penalty+=PEN;S.wrong++;S.lockUntil=now()+LOCK*1000;save();showPenalty("−"+PEN+" s");
  feedback(isOrder?("Not yet – "+ok+" of "+n+" cards are in the right place. Read p. 40 again."):("Not yet – "+ok+" of "+n+" correct. Read the text again."),"bad");tick()}
function solve(R,skipped){
  var i=R.n-1;if(S.progress===i){S.letters.push(R.letter);S.progress++}S.view="map";save();renderLetters();
  var ov=el("div",{class:"ov"},[el("div",{},[el("div",{class:"sub",style:"color:#9fb2d8;letter-spacing:.14em",text:"FUSE "+R.n+" RESET ⚡"}),el("div",{class:"big",text:R.letter}),el("p",{text:S.progress>=NR?"All fuses are back on! Now: the main switch.":"New letter collected."})])]);
  document.body.appendChild(ov);setTimeout(function(){ov.remove();renderMap()},skipped?200:1900)}

/* hints */
function hintText(i){return i==="fin"?"Rearrange your seven letters. The word is something every applicant wants to have.":ROOMS[i].hint}
function askHint(){
  var v=S.view;if(v==="start"||v==="end"||v==="map"){modal("Hint","<p>Open a fuse box first. Hints belong to the task you are working on.</p>");return}
  var key=String(v);if(S.hintRooms[key]){modal("Hint (already bought)","<p>"+hintText(v)+"</p>");return}
  if(hintsLeft()<=0){modal("No hints left","<p>Your team has used all 3 hints. Read the Student's Book carefully!</p>");return}
  modal("Use a hint?","<p>You have <b>"+hintsLeft()+"</b> hint(s) left. A hint costs <b>"+HINTCOST+" seconds</b>.</p>",[{t:"Yes, use a hint",f:function(){S.hints.push(key);S.hintRooms[key]=true;S.penalty+=HINTCOST;save();renderTop();showPenalty("−"+HINTCOST+" s");modal("Hint","<p>"+hintText(v)+"</p>")}},{t:"No, keep going",sec:true}])}

/* finale */
function openFinale(){
  S.view="fin";save();var m=$("#main");m.innerHTML="";
  var t=el("div",{class:"room"});t.appendChild(el("div",{class:"hd",html:icon(8)+'<div><div class="bk">FINALE · MAIN SWITCH</div><h2 style="margin:.1em 0">The code word</h2></div>'}));
  t.appendChild(el("div",{class:"brief",text:"Your seven letters open the main switch – but they are in the wrong order. Rearrange them to find the word. It describes what you want your application to be."}));
  var c=el("div",{class:"code"});S.letters.forEach(function(l){c.appendChild(el("div",{class:"lt on",text:l}))});t.appendChild(c);
  var card=el("div",{class:"card",style:"text-align:center"});
  var inp=el("input",{type:"text",id:"finalin",maxlength:"7",autocomplete:"off",autocapitalize:"characters",autocorrect:"off",spellcheck:"false","aria-label":"Code word",placeholder:"_ _ _ _ _ _ _"});card.appendChild(inp);t.appendChild(card);
  t.appendChild(el("div",{class:"feedback",id:"fb","aria-live":"polite"}));
  var act=el("div",{class:"actions"});var cb=el("button",{class:"btn",id:"checkbtn",type:"button",text:"Pull the main switch",onclick:function(){
    if(lockLeft()>0)return;var v=inp.value;if(!v.trim()){feedback("Type the code word first.","info");return}
    cb.disabled=true;cb.setAttribute("data-busy","1");check("fin",0,v).then(function(ok){cb.removeAttribute("data-busy");if(ok){finish()}else{S.penalty+=PEN;S.wrong++;S.lockUntil=now()+LOCK*1000;save();showPenalty("−"+PEN+" s");feedback("That is not the code word. Use all seven letters.","bad");tick()}})}});
  cb.setAttribute("data-label","Pull the main switch");act.appendChild(cb);act.appendChild(el("button",{class:"btn sec small",type:"button",text:"← Back",onclick:renderMap}));t.appendChild(act);m.appendChild(t);tick()}
function finish(){S.finished=true;S.endAt=now();S.view="end";save();$("#banner").classList.add("hidden");renderEnd()}

/* end */
function renderEnd(){
  showTop(true);renderTop();$("#hintbtn").classList.add("hidden");$("#banner").classList.add("hidden");var m=$("#main");m.innerHTML="";var r=remaining();
  var c=el("div",{class:"cert"});
  c.innerHTML='<div style="width:80px;margin:0 auto">'+icon(5,"#d99f00")+'</div><div style="letter-spacing:.16em;font-weight:700;color:#5a6a87">CERTIFICATE</div><h2>Bright Sparks Apprentices</h2><p>The lights are back on! This team wrote its way out of the blackout:</p><div class="team"></div>'+
   '<div class="facts"><div>'+(r>=0?"Power left":"Overtime")+'<b>'+(r>=0?fmt(r):"+"+fmt(-r))+'</b></div><div>Hints used<b>'+S.hints.length+' of '+MAXHINTS+'</b></div><div>Code word<b>SUCCESS</b></div></div><p style="color:#5a6a87;margin:0">Take a screenshot of this certificate.</p>';
  c.querySelector(".team").textContent=S.team;m.appendChild(c);
  var q=el("div",{class:"glass",style:"margin-top:18px"});q.appendChild(el("h3",{text:"Your own application – not marked"}));q.appendChild(el("p",{text:"Write two sentences: Why should Bright Sparks give you the job? Use at least one complex linking word."}));
  var ta=el("textarea",{"aria-label":"Your two sentences",maxlength:"600"});ta.value=S.reflection||"";ta.addEventListener("input",function(){S.reflection=ta.value;save()});q.appendChild(ta);m.appendChild(q);
  m.appendChild(el("div",{class:"actions",style:"margin-top:16px"},[el("button",{class:"btn sec small",type:"button",text:"Start a new game",onclick:function(){modal("Start a new game?","<p>The current result will be deleted from this iPad.</p>",[{t:"Yes, new game",f:function(){S=fresh();save();$("#hintbtn").classList.remove("hidden");renderStart()}},{t:"Cancel",sec:true}])}})]));
  window.scrollTo(0,0)}

/* teacher mode (?teacher + PIN) */
function setupTeacher(){
  var q=location.search||"";if(!/(^|[?&])teacher(=|&|$)/.test(q))return;
  var b=el("button",{class:"tbtn",type:"button","aria-label":"Teacher mode",text:"T",onclick:askPin});document.body.appendChild(b)}
function askPin(){
  var m=el("div",{class:"modal"});var box=el("div",{class:"box"});box.appendChild(el("h3",{text:"Teacher mode"}));
  var inp=el("input",{type:"text",inputmode:"numeric",autocomplete:"off","aria-label":"PIN",placeholder:"PIN",style:"width:100%"});box.appendChild(inp);var msg=el("p",{style:"color:#c4262e;min-height:24px"});box.appendChild(msg);
  var row=el("div",{class:"actions"});
  function go(){sha256("spark|pin|0|"+norm(inp.value)).then(function(h){if((H["pin|0"]||[]).indexOf(h)>=0){m.remove();teacherPanel()}else msg.textContent="Wrong PIN."})}
  row.appendChild(el("button",{class:"btn small",type:"button",text:"Open",onclick:go}));row.appendChild(el("button",{class:"btn small sec",type:"button",text:"Cancel",onclick:function(){m.remove()}}));
  box.appendChild(row);m.appendChild(box);document.body.appendChild(m);inp.focus();inp.addEventListener("keydown",function(e){if(e.key==="Enter")go()})}
function teacherPanel(){
  var T=teacherData();if(!T){modal("Teacher mode","<p>Solutions could not be read.</p>");return}
  var h="<p>Final code word: <b>"+T.final+"</b></p><table class='sol'><tr><th>Fuse</th><th>Letter</th><th>Solution</th></tr>";
  T.rooms.forEach(function(r){h+="<tr><td>"+r.n+" "+r.title+"</td><td>"+r.letter+"</td><td>"+r.ans.map(function(a,i){return (i+1)+") "+String(a).replace(/&/g,"&amp;").replace(/</g,"&lt;")}).join("<br>")+"</td></tr>"});h+="</table>";
  var mm=modal("Teacher mode – solutions",h,[
   {t:"Skip current fuse",f:function(){if(S.started&&S.progress<NR){solve(ROOMS[S.progress],true)}}},
   {t:"+5 minutes",sec:true,f:function(){S.penalty-=300;save();tick()}},
   {t:"Reset game",sec:true,f:function(){S=fresh();save();$("#hintbtn").classList.remove("hidden");$("#banner").classList.add("hidden");renderStart()}},
   {t:"Close",sec:true}]);mm.querySelector(".box").style.maxWidth="760px"}

/* init */
setupTeacher();
if(!S.started||S.view==="start"){renderStart()}
else if(S.finished||S.view==="end"){renderEnd()}
else{showTop(true);renderTop();if(typeof S.view==="number"&&S.view<=S.progress&&S.view<NR)openRoom(S.view);else if(S.view==="fin"&&S.progress>=NR)openFinale();else renderMap()}
setInterval(tick,250);tick();
})();
</script>
</body>
